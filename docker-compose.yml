version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: tvtime_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tvtime
      POSTGRES_USER: tvtime_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tvtime_app -d tvtime']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
