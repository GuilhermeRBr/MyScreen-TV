<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!--
    Maskable icon: a zona segura (safe zone) é um círculo de 80% do tamanho total.
    Área segura: raio = 512 * 0.4 = 204.8px. O conteúdo deve estar dentro de 204px de raio a partir do centro.
    Preenchimento sólido como fundo para recorte em qualquer forma.
  -->
  <rect width="512" height="512" fill="#eb5757"/>
  <!-- Logotipo centralizado com margem para safe zone (escala menor para caber no círculo de 80%) -->
  <!-- Logo em 85x88, escala 4.0 → 340x352; offset: x=(512-340)/2=86, y=(512-352)/2=80 -->
  <g transform="translate(86, 80) scale(4)">
    <path d="M9.70996 2.85057C15.7341 -0.763892 23.2134 -0.953477 29.4121 2.35253L74.4121 26.3525C80.9293 29.8284 85 36.6138 85 44C85 51.3862 80.9293 58.1716 74.4121 61.6474L29.4121 85.6474C23.2134 88.9535 15.7341 88.7639 9.70996 85.1494C3.68602 81.5349 0 75.0251 0 68V20C0 12.9748 3.68602 6.46507 9.70996 2.85057Z" fill="#ffffff"/>
    <path d="M24 25V62L59 43.5L24 25Z" fill="#eb5757" stroke="#eb5757" stroke-width="8" stroke-linejoin="round"/>
  </g>
</svg>
