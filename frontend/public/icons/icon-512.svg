<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Fundo preto com bordas arredondadas -->
  <rect width="512" height="512" rx="96" fill="#111114"/>

  <!--
    Logo centralizado em 512x512.
    Viewbox original: 85x88.
    Escala: 2.5 → logo fica com 212.5x220 px.
    Offset para centralizar: x=(512-212.5)/2=149.75, y=(512-220)/2=146
    Arredondado: translate(150, 146)
  -->
  <g transform="translate(150, 146) scale(2.5)">
    <defs>
      <linearGradient id="ic512-outer" x1="0" y1="0" x2="87.9471" y2="84.9489" gradientUnits="userSpaceOnUse">
        <stop stop-color="#EB5757"/>
        <stop offset="1" stop-color="#C0392B"/>
      </linearGradient>
      <clipPath id="ic512-clip">
        <rect width="85" height="88"/>
      </clipPath>
    </defs>
    <g clip-path="url(#ic512-clip)">
      <!-- Forma externa: escudo arredondado com degradê vermelho -->
      <path d="M9.70996 2.85057C15.7341 -0.763892 23.2134 -0.953477 29.4121 2.35253L74.4121 26.3525C80.9293 29.8284 85 36.6138 85 44C85 51.3862 80.9293 58.1716 74.4121 61.6474L29.4121 85.6474C23.2134 88.9535 15.7341 88.7639 9.70996 85.1494C3.68602 81.5349 0 75.0251 0 68V20C0 12.9748 3.68602 6.46507 9.70996 2.85057Z" fill="url(#ic512-outer)"/>
      <!-- Triângulo interno: preto escuro, idêntico ao original -->
      <path d="M24 25V62L59 43.5L24 25Z" fill="#111426" stroke="#111426" stroke-width="8" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
