<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!--
    Maskable icon: safe zone é 80% da área total (círculo de raio 204px).
    O conteúdo visível deve caber dentro desse círculo.
    Fundo preto sólido — será recortado em qualquer forma pelo launcher.
  -->
  <rect width="512" height="512" fill="#111114"/>

  <!--
    Logo dentro da safe zone (80% = 409.6px de diâmetro).
    Escala conservadora: 2.0 → logo fica com 170x176 px (bem dentro dos 409px).
    Offset para centralizar: x=(512-170)/2=171, y=(512-176)/2=168
  -->
  <g transform="translate(171, 168) scale(2.0)">
    <defs>
      <linearGradient id="icm-outer" x1="0" y1="0" x2="87.9471" y2="84.9489" gradientUnits="userSpaceOnUse">
        <stop stop-color="#EB5757"/>
        <stop offset="1" stop-color="#C0392B"/>
      </linearGradient>
      <clipPath id="icm-clip">
        <rect width="85" height="88"/>
      </clipPath>
    </defs>
    <g clip-path="url(#icm-clip)">
      <!-- Forma externa: escudo arredondado com degradê vermelho -->
      <path d="M9.70996 2.85057C15.7341 -0.763892 23.2134 -0.953477 29.4121 2.35253L74.4121 26.3525C80.9293 29.8284 85 36.6138 85 44C85 51.3862 80.9293 58.1716 74.4121 61.6474L29.4121 85.6474C23.2134 88.9535 15.7341 88.7639 9.70996 85.1494C3.68602 81.5349 0 75.0251 0 68V20C0 12.9748 3.68602 6.46507 9.70996 2.85057Z" fill="url(#icm-outer)"/>
      <!-- Triângulo interno: preto escuro -->
      <path d="M24 25V62L59 43.5L24 25Z" fill="#111426" stroke="#111426" stroke-width="8" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
