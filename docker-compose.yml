version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: myscreen_tv_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: myscreen_tv
      POSTGRES_USER: myscreen_tv_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U myscreen_tv_app -d myscreen_tv']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
