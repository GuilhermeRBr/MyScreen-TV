version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: myscreen_tv_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: myscreen_tv
      POSTGRES_USER: myscreen_tv_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U myscreen_tv_app -d myscreen_tv']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: myscreen_tv_redis
    restart: unless-stopped
    # Configuração recomendada para BullMQ:
    # - maxmemory-policy noeviction: nunca remove chaves arbitrariamente (jobs pendentes ficam seguros)
    # - appendonly yes: persistência AOF para sobreviver a reinicializações
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy noeviction
      --appendonly yes
      --appendfilename appendonly.aof
      --requirepass ${REDIS_PASSWORD}
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
